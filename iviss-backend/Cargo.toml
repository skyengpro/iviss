[package]
name = "iviss-backend"
version = "0.1.0"
edition = "2021"
default-run = "iviss-backend"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "time", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip", "timeout"] }
anyhow = "1.0"
thiserror = "1.0"
