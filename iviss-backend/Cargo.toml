[package]
name = "iviss-backend"
version = "0.1.0"
edition = "2021"
default-run = "iviss-backend"

[profile.release]
opt-level = "z"     # Optimise pour la taille (ou "s" pour un compromis)
lto = true          # Link Time Optimization : analyse tout le graphe de dépendances
codegen-units = 1   # Réduit le parallélisme à la compilation pour mieux optimiser
strip = true        # Retire les symboles de debug du binaire final

[features]
default = ["api"]
api = [
    "dep:axum",
    "dep:sqlx",
    "dep:leptess",
    "dep:image",
    "dep:imageproc",
    "dep:utoipa",
    "dep:utoipa-swagger-ui",
    "dep:tower-http",
    "dep:moka",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:lettre",
    "dep:jsonwebtoken",
    "dep:rsa",
    "dep:p256",
    "dep:ecdsa",
    "dep:argon2",
    "dep:hmac",
    "dep:sha2",
]

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"], optional = true }
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "time", "migrate"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip", "timeout", "set-header"], optional = true }
anyhow = "1.0"
thiserror = "1.0"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aes-gcm = "0.10"

# Observability - Metrics (Prometheus)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }

# Observability - Distributed Tracing (OpenTelemetry)
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

utoipa = { version = "4", features = ["axum_extras", "uuid", "time"], optional = true }
utoipa-swagger-ui = { version = "7", features = ["axum", "vendored"], optional = true }
time = { version = "0.3.36", features = ["serde", "macros"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
regex = "1.12.3"
once_cell = "1.21.3"
leptess = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }
imageproc = { version = "0.25", optional = true }

async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"

sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
rand = "0.8"
argon2 = { version = "0.5", optional = true }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"], optional = true }
rsa = { version = "0.9", features = ["pem"], optional = true }
base64 = "0.22.1"

p256 = { version = "0.13", features = ["ecdsa", "jwk"], optional = true }
ecdsa = { version = "0.16", features = ["verifying"], optional = true }
moka = { version = "0.12.15", features = ["future"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "pool"], optional = true }

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "minio"] }
mockito = "1.4"
tokio-test = "0.4"
tower = "0.5"
