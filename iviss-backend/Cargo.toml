[package]
name = "iviss-backend"
version = "0.1.0"
edition = "2021"
default-run = "iviss-backend"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "time", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip", "timeout"] }
anyhow = "1.0"
thiserror = "1.0"

jsonwebtoken = "9"
base64 = "0.22"

utoipa = { version = "4", features = ["axum_extras", "uuid", "time"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
time = "0.3.47"
uuid = { version = "1.20.0", features = ["v4", "serde",]}
regex = "1.12.3"
once_cell = "1.21.3"
leptess = "0.14"
image = "0.25"

deadpool-redis = { version = "0.18", features = ["rt_tokio_1"] }
redis = { version = "0.27", features = ["tokio-comp"] }

async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }

sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis", "postgres"] }
tokio-test = "0.4"
tower = "0.5"
rsa = { version = "0.9", features = ["pem"] }