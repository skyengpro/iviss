[package]
name = "iviss-test-api"
version = "0.1.0"
edition = "2021"
description = "Mock external vehicle registry API for local development and testing"

# ── Release profile ─────────────────────────────────────────────────────────
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# ── Dependencies ─────────────────────────────────────────────────────────────
[dependencies]
axum            = "0.7"
tokio           = { version = "1", features = ["full"] }
sqlx            = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy         = "0.15"
anyhow          = "1"
base64          = "0.22"
tower-http      = { version = "0.5", features = ["trace"] }
time            = { version = "0.3", features = ["formatting", "macros"] }
