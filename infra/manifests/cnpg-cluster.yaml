# CloudNativePG cluster for IVISS workloads.
#
# Password flow:
#   1. Admin creates iviss-db-app ExternalSecret (pulls db_password from ASM).
#   2. CNPG bootstrap: reads iviss-db-app secret, creates iviss user with that password.
#   3. ExternalSecrets sync every hour — CNPG continuously reconciles
#      passwords from the secret via ALTER ROLE.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iviss-db
  namespace: iviss
spec:
  instances: 3
  storage:
    size: 15Gi
    storageClass: hcloud-volumes

  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: iviss
      owner: iviss

  managed:
    roles:
      - name: "iviss"
        ensure: "present"
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: iviss-db-app

  monitoring:
    enablePodMonitor: true

---
# Connection metadata ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: iviss-db-connection
  namespace: iviss
data:
  host: iviss-db-rw.iviss.svc.cluster.local
  port: "5432"
  sslmode: require

---
# NetworkPolicy for iviss-db pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iviss-db-allow-app-namespaces
  namespace: iviss
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: iviss-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iviss
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres-operator
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP