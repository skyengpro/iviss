# ExternalSecret CR for the IVISS app role password.
# CNPG reads this secret and uses it for the iviss user password,
# continuously reconciling via ALTER ROLE on each ESO sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iviss-db-app
  namespace: iviss
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: iviss-db-app
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: iviss/prod/app-secrets
        property: db_password