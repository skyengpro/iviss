---
- name: Deploy IVISS to production
  hosts: all
  become: yes
  vars:
    # These will be overridden by the deploy script / extra-vars
    docker_username: "{{ lookup('env', 'GITHUB_USERNAME') }}"
    docker_password: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    app_dir: "/opt/iviss"

  roles:
    - iviss
