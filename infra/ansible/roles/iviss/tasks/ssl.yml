---
- name: Check if certificate exists
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_stat

- name: Remove stale Certbot locks
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /var/lib/letsencrypt/.certbot.lock
    - /tmp/certbot.lock
  ignore_errors: yes

- name: Obtain SSL certificate
  command: >
    certbot --nginx
    -d {{ domain_name }}
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
  register: certbot_obtain
  until: certbot_obtain is success
  retries: 3
  delay: 10
  when: not cert_stat.stat.exists

- name: Re-apply Certbot configuration if missing from Nginx
  command: >
    certbot install --nginx
    -d {{ domain_name }}
    --cert-name {{ domain_name }}
    --non-interactive
  when: 
    - cert_stat.stat.exists
    - certbot_check.rc != 0
    - domain_name is defined
