- name: Debug Docker Config
  debug:
    msg: "Username is '{{ docker_username }}' and Password length is {{ docker_password | length }}"

- name: Login to GitHub Container Registry
  docker_login:
    registry_url: ghcr.io
    username: "{{ docker_username }}"
    password: "{{ docker_password }}"

- name: Copy docker-compose.yml
  copy:
    src: "../../../../../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: '0644'

- name: Generate .env file for Docker Compose (Root)
  template:
    src: dotenv.j2
    dest: "{{ app_dir }}/.env"
    mode: '0600'

- name: Create backend directory
  file:
    path: "{{ app_dir }}/iviss-backend"
    state: directory
    mode: '0755'

- name: Generate .env file for Backend (Specific)
  template:
    src: dotenv.j2
    dest: "{{ app_dir }}/iviss-backend/.env"
    mode: '0600'

- name: Create frontend directory
  file:
    path: "{{ app_dir }}/frontend"
    state: directory
    mode: '0755'

- name: Generate .env file for Frontend (Specific)
  template:
    src: frontend_dotenv.j2
    dest: "{{ app_dir }}/frontend/.env"
    mode: '0600'

- name: Pull Docker images
  command: docker compose pull
  args:
    chdir: "{{ app_dir }}"
  environment:
    COMPOSE_PROFILES: prod

- name: Start services
  block:
    - name: Run docker compose up
      command: docker compose --profile prod up -d --force-recreate
      args:
        chdir: "{{ app_dir }}"
  rescue:
    - name: Show backend container logs after failed start
      command: docker compose --profile prod logs --no-color --tail=200 backend-prod
      args:
        chdir: "{{ app_dir }}"
      register: backend_logs
      changed_when: false
      ignore_errors: true

    - name: Print backend logs for troubleshooting
      debug:
        msg: "{{ backend_logs.stdout | default('No backend logs available') }}"

    - name: Detect missing sqlx migration error (known case)
      set_fact:
        sqlx_missing_migration_20260422051000: >-
          {{
            (backend_logs.stdout | default('')) is search('migration 20260422051000 was previously applied but is missing in the resolved migrations')
          }}

    - name: Repair sqlx migrations table for missing migration (20260422051000)
      command:
        argv:
          - docker
          - compose
          - --profile
          - prod
          - exec
          - -T
          - db
          - psql
          - -U
          - "{{ db_user }}"
          - -d
          - "{{ db_name }}"
          - -c
          - "DELETE FROM _sqlx_migrations WHERE version = 20260422051000;"
      args:
        chdir: "{{ app_dir }}"
      when: sqlx_missing_migration_20260422051000 | bool
      register: sqlx_repair
      changed_when: "'DELETE 1' in (sqlx_repair.stdout | default(''))"
      failed_when: false

    - name: Retry docker compose up after sqlx repair
      command: docker compose --profile prod up -d --force-recreate
      args:
        chdir: "{{ app_dir }}"
      when: sqlx_missing_migration_20260422051000 | bool
      register: retry_up
      failed_when: false

    - name: Fail deployment after log collection
      fail:
        msg: >-
          docker compose up failed; see backend-prod logs above.
          {{
            (sqlx_missing_migration_20260422051000 | bool)
            | ternary(' Attempted automatic sqlx repair for migration 20260422051000 and retried once.', '')
          }}
      when: >
        (not (sqlx_missing_migration_20260422051000 | bool))
        or
        (sqlx_missing_migration_20260422051000 | bool and (retry_up is not defined or retry_up.rc != 0))
