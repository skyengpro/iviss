apiVersion: v1
kind: Service
metadata:
  name: {{ include "iviss.backend.fullname" . }}
  labels:
    {{- include "iviss.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.config.serverPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "iviss.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
