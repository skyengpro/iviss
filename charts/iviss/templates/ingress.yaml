{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "iviss.fullname" . }}
  labels:
    {{- include "iviss.labels" . | nindent 4 }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{- if not (hasSuffix "server-snippet" $key) }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
{{- if and .Values.cloudfrontOriginSecret .Values.ingress.annotations }}
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($http_x_origin_verify != "{{ .Values.cloudfrontOriginSecret }}") {
        return 403;
      }
{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "iviss.frontend.fullname" $ }}
                port:
                  number: 80
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
