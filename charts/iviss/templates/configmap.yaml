apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iviss.fullname" . }}-config
  labels:
    {{- include "iviss.labels" . | nindent 4 }}
data:
  SERVER_HOST: {{ .Values.backend.config.serverHost | quote }}
  SERVER_PORT: {{ .Values.backend.config.serverPort | quote }}
  LOG_LEVEL: {{ .Values.backend.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.backend.config.environment | quote }}
  SHIFT_START_HOUR: {{ .Values.backend.config.shiftStartHour | quote }}
  SHIFT_END_HOUR: {{ .Values.backend.config.shiftEndHour | quote }}
  SMS_PROVIDER: {{ .Values.backend.config.smsProvider | quote }}
  EMAIL_PROVIDER: {{ .Values.backend.config.emailProvider | quote }}
  OTP_VIA_EMAIL: {{ .Values.backend.config.otpViaEmail | quote }}
  RESEND_FROM_EMAIL: {{ .Values.backend.config.resendFromEmail | quote }}
  SMTP_HOST: {{ .Values.backend.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.backend.config.smtpPort | quote }}
  SMTP_USERNAME: {{ .Values.backend.config.smtpUsername | quote }}
  SQLX_OFFLINE: "true"
{{- if .Values.backend.config.externalApiBaseUrl }}
  EXTERNAL_API_BASE_URL: {{ .Values.backend.config.externalApiBaseUrl | quote }}
{{- end }}
{{- if .Values.backend.config.externalApiLockNdia }}
  EXTERNAL_API_LOCK_NDIA: {{ .Values.backend.config.externalApiLockNdia | quote }}
{{- end }}
{{- if .Values.backend.config.externalApiKindia }}
  EXTERNAL_API_KINDIA: {{ .Values.backend.config.externalApiKindia | quote }}
{{- end }}
{{- if .Values.backend.config.externalApiUser }}
  EXTERNAL_API_USER: {{ .Values.backend.config.externalApiUser | quote }}
{{- end }}
{{- if .Values.backend.config.externalApiClient }}
  EXTERNAL_API_CLIENT: {{ .Values.backend.config.externalApiClient | quote }}
{{- end }}
{{- if .Values.backend.config.externalApiCtr }}
  EXTERNAL_API_CTR: {{ .Values.backend.config.externalApiCtr | quote }}
{{- end }}
{{- if .Values.frontend.config.viteApiUrl }}
  VITE_API_URL: {{ .Values.frontend.config.viteApiUrl | quote }}
{{- end }}
