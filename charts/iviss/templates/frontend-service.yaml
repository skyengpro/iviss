apiVersion: v1
kind: Service
metadata:
  name: {{ include "iviss.frontend.fullname" . }}
  labels:
    {{- include "iviss.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "iviss.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
