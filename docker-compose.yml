services:
  # PostgreSQL 15 Database Service (Alpine variant for smaller image size)
  db:
    image: postgres:15-alpine
    container_name: iviss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iviss_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iviss_password}
      POSTGRES_DB: ${POSTGRES_DB:-iviss_dev}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iviss_user} -d ${POSTGRES_DB:-iviss_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: iviss-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Adminer Database Management
  adminer:
    image: adminer
    container_name: iviss-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - iviss-network

  # Rust Backend Service
  backend:
    build:
      context: ./iviss-backend
      dockerfile: Dockerfile
      target: development
    container_name: iviss-backend
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-iviss_user}:${POSTGRES_PASSWORD:-iviss_password}@iviss-db:5432/${POSTGRES_DB:-iviss_dev}
      EXTERNAL_DATABASE_URL: postgres://${EXTERNAL_POSTGRES_USER:-external_user}:${EXTERNAL_POSTGRES_PASSWORD:-external_password}@${EXTERNAL_POSTGRES_HOST:-localhost}:${EXTERNAL_POSTGRES_PORT:-5432}/${EXTERNAL_POSTGRES_DB:-external_db}
      REDIS_URL: redis://iviss-redis:6379
      SQLX_OFFLINE: "true"
      JWT_SECRET: ${JWT_SECRET:-your_dev_jwt_secret_change_in_production}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      ACTIVATION_CODE_PEPPER: ${ACTIVATION_CODE_PEPPER:-dev_activation_code_pepper_must_be_32_chars_min}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-mock}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-mock}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-mock}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reloading
      - ./iviss-backend/src:/app/src:ro
      - ./iviss-backend/Cargo.toml:/app/Cargo.toml:ro
      - ./iviss-backend/Cargo.lock:/app/Cargo.lock:ro
      - ./iviss-backend/migrations:/app/migrations:ro
      - ./iviss-backend/.sqlx:/app/.sqlx:ro
      # Cache dependencies in named volume for faster builds
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: iviss-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      - BACKEND_OPENAPI_URL=http://iviss-backend:3000/api-doc/openapi.json
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./scripts:/scripts
    command: npm run dev -- --host
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Metrics Collector Service (Bridges browser metrics to Prometheus)
  metrics:
    build:
      context: ./frontend
      dockerfile: Dockerfile.metrics
    container_name: iviss-metrics-server
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      - NODE_ENV=development
      - METRICS_PORT=9091
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9091/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

networks:
  iviss-network:
    driver: bridge

volumes:
  # Named volume for PostgreSQL data persistence
  postgres_data:
    driver: local
  # Named volume for Redis data persistence
  redis_data:
    driver: local
  # Cache volumes for faster Rust builds
  cargo_cache:
    driver: local
  target_cache:
    driver: local
