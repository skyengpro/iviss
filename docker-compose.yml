services:
  # PostgreSQL 15 Database Service (Alpine variant for smaller image size)
  db:
    image: postgres:15-alpine
    container_name: iviss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iviss_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iviss_password}
      POSTGRES_DB: ${POSTGRES_DB:-iviss_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iviss_user} -d ${POSTGRES_DB:-iviss_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Rust Backend Service
  backend:
    build:
      context: ./iviss-backend
      dockerfile: Dockerfile
      target: development
    container_name: iviss-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iviss_user}:${POSTGRES_PASSWORD:-iviss_password}@db:5432/${POSTGRES_DB:-iviss_db}
      EXTERNAL_DATABASE_URL: postgresql://${EXTERNAL_POSTGRES_USER:-external_user}:${EXTERNAL_POSTGRES_PASSWORD:-external_password}@${EXTERNAL_POSTGRES_HOST:-localhost}:${EXTERNAL_POSTGRES_PORT:-5432}/${EXTERNAL_POSTGRES_DB:-external_db}
      JWT_SECRET: ${JWT_SECRET:-your_dev_jwt_secret_change_in_production}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reloading
      - ./iviss-backend/src:/app/src:ro
      - ./iviss-backend/Cargo.toml:/app/Cargo.toml:ro
      - ./iviss-backend/Cargo.lock:/app/Cargo.lock:ro
      # Cache dependencies in named volume for faster builds
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: iviss-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # ————————————————————————————————————————
  # Monitoring Stack
  # ————————————————————————————————————————

  # Frontend Metrics Server — receives browser metrics, exposes to Prometheus
  metrics-server:
    build:
      context: ./frontend
      dockerfile: Dockerfile.metrics
    container_name: iviss-metrics-server
    restart: unless-stopped
    environment:
      METRICS_PORT: 9091
    ports:
      - "9091:9091"
    volumes:
      - ./frontend/metrics-server.js:/app/metrics-server.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Prometheus — scrapes and stores metrics
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iviss-prometheus
    restart: unless-stopped
    depends_on:
      metrics-server:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

  # Grafana — dashboards and visualization
  grafana:
    image: grafana/grafana:10.4.1
    container_name: iviss-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iviss-network

networks:
  iviss-network:
    driver: bridge

volumes:
  # Named volume for PostgreSQL data persistence
  postgres_data:
    driver: local
  # Cache volumes for faster Rust builds
  cargo_cache:
    driver: local
  target_cache:
    driver: local
  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
