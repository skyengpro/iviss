x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

include:
  - path: iviss-backend/docker-compose.yml
    env_file: .env
  - path: frontend/docker-compose.yml
    env_file: .env

services:
  # PostgreSQL service shared by dev and prod-style local runs
  db:
    image: postgres:15-alpine
    container_name: iviss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iviss_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-iviss_dev}
    ports:
      - "5435:5432"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iviss_user} -d ${POSTGRES_DB:-iviss_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - iviss-network


  # Adminer is useful for local development only
  adminer:
    profiles: ["dev"]
    image: adminer
    container_name: iviss-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    logging: *default-logging
    networks:
      - iviss-network

  minio:
    profiles: ["dev"]
    image: minio/minio:latest
    container_name: iviss-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - iviss-network

  minio-init:
    profiles: ["dev"]
    image: minio/mc:latest
    container_name: iviss-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        set -e;
        mc alias set iviss-minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing iviss-minio/${S3_CACHE_BUCKET:-iviss-vehicle-cache};
        mc version enable iviss-minio/${S3_CACHE_BUCKET:-iviss-vehicle-cache};
      "
    logging: *default-logging
    networks:
      - iviss-network

networks:
  iviss-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  cargo_cache:
    driver: local
  target_cache:
    driver: local
  minio_data:
    driver: local
