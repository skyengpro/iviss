x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Development frontend with Vite and bind mounts
  frontend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: iviss-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      VITE_API_URL: ""
      BACKEND_OPENAPI_URL: http://iviss-backend:3000/api-doc/openapi.json
    volumes:
      - .:/app
      - /app/node_modules
      - ../scripts:/scripts
    command: npm run dev -- --host
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - iviss-network

  # Production-like frontend, opt-in with: docker compose --profile prod up frontend-prod
  frontend-prod:
    profiles: ["prod"]
    image: ghcr.io/${DOCKER_ORG:-skyengpro}/iviss/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://${DOMAIN_NAME:-localhost}
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - iviss-network

  metrics:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: iviss-metrics-server
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      NODE_ENV: production
      METRICS_PORT: 9091
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9091/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    networks:
      - iviss-network
