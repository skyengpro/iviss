name: Unified Release & Docker Pipeline

on:
  push:
    branches:
      - aws-dev-test
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/aws-dev-test' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    name: Determine Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
          branch: ${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}

  docker:
    name: Build & Push Docker Images
    needs: release
    if: (needs.release.outputs.new_release_published == 'true') || (github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/aws-dev-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
        include:
          - service: frontend
            context: ./frontend
            target: prod
          - service: backend
            context: ./iviss-backend
            target: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            ${{ needs.release.outputs.new_release_version != '' && format('type=raw,value={0}', needs.release.outputs.new_release_version) || '' }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-edge:
    name: Deploy CloudFront Edge (Terraform)
    needs: [release, docker]
    if: (needs.release.outputs.new_release_published == 'true') || (github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/aws-dev-test')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: iviss-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Terraform Apply (AWS Edge)
        working-directory: ./infra/terraform
        env:
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || secrets.DOMAIN_NAME }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || secrets.ROUTE53_ZONE_ID || '' }}
          TF_VAR_k8s_origin_hostname: ${{ vars.K8S_ORIGIN_HOSTNAME || secrets.K8S_ORIGIN_HOSTNAME || '' }}
          TF_VAR_certbot_email: ${{ vars.CERTBOT_EMAIL || secrets.CERTBOT_EMAIL }}
        run: |
          terraform init
          terraform apply -auto-approve

  update-helm-values:
    name: Update Helm Chart Version
    needs: [release, docker]
    if: (needs.release.outputs.new_release_published == 'true') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new release version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          sed -i "s/^  imageTag:.*/  imageTag: \"${RELEASE_VERSION}\"/" charts/iviss/values-production.yaml
          git config user.name "iviss-bot"
          git config user.email "bot@iviss.cloud"
          git add charts/iviss/values-production.yaml
          git commit -m "chore: update Helm chart image tag to ${RELEASE_VERSION}"
          git push
