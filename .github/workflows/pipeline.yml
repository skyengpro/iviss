name: Unified Release & Docker Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Determine Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
          branch: main

      - name: Report timing
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $START_TIME ))
          echo "### Release: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build & Push Docker Images
    needs: release
    if: (needs.release.outputs.new_release_published == 'true') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
        include:
          - service: frontend
            context: ./frontend
            target: prod
          - service: backend
            context: ./iviss-backend
            target: production
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            ${{ needs.release.outputs.new_release_version != '' && format('type=raw,value={0}', needs.release.outputs.new_release_version) || '' }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://api.iviss.skyengpro.app

      - name: Report timing
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $START_TIME ))
          echo "### Docker Build (${{ matrix.service }}): ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  update-om-values:
    name: Update OM Repo Image Tags
    needs: [release, docker]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout OM repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: skyengpro/om
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Update backend image tag
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          sed -i "s|^\(  tag:\).*|\1 \"${VERSION}\"|" helm/values/iviss/api.yaml

      - name: Update frontend image tag
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          sed -i "s|^\(  tag:\).*|\1 \"${VERSION}\"|" helm/values/iviss/web.yaml

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          git config user.name "iviss-bot"
          git config user.email "bot@iviss.cloud"
          git add helm/values/iviss/api.yaml helm/values/iviss/web.yaml
          git commit -m "chore: update iviss image tags to ${VERSION}"
          git push