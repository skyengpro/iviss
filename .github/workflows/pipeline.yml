name: Unified Release & Docker Pipeline

on:
  push:
    branches:
      - aws-dev-test
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/aws-dev-test' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    name: Determine Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
          branch: ${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}

  docker:
    name: Build & Push Docker Images
    needs: release
    # Run if a new release was published OR triggered manually OR on our test branch
    if: (needs.release.outputs.new_release_published == 'true') || (github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/aws-dev-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
        include:
          - service: frontend
            context: ./frontend
            target: prod
          - service: backend
            context: ./iviss-backend
            target: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            ${{ needs.release.outputs.new_release_version != '' && format('type=raw,value={0}', needs.release.outputs.new_release_version) || '' }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS
    needs: [release, docker]
    if: (needs.release.outputs.new_release_published == 'true') || (github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/aws-dev-test')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: iviss-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Setup Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Deploy via Script
        env:
          USE_SECRETS_MANAGER: "true"
          DOCKER_ORG: ${{ github.repository_owner }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || 'donemmanuelo' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME || secrets.DOMAIN_NAME }}
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID || secrets.ROUTE53_ZONE_ID || '' }}
          EDGE_LOCKDOWN_ENABLED: ${{ vars.EDGE_LOCKDOWN_ENABLED || 'true' }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || secrets.CERTBOT_EMAIL }}
          IMAGE_TAG: ${{ needs.release.outputs.new_release_version || 'latest' }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'iviss_user' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'iviss_dev' }}
          # Admin Bootstrap
          ADMIN_BOOTSTRAP_EMAIL: ${{ vars.ADMIN_BOOTSTRAP_EMAIL || secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ vars.ADMIN_BOOTSTRAP_PASSWORD || secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          ADMIN_BOOTSTRAP_PHONE: ${{ vars.ADMIN_BOOTSTRAP_PHONE || secrets.ADMIN_BOOTSTRAP_PHONE }}
          ADMIN_BOOTSTRAP_USERNAME: ${{ vars.ADMIN_BOOTSTRAP_USERNAME || secrets.ADMIN_BOOTSTRAP_USERNAME }}
          # Shift configuration
          SHIFT_START_HOUR: ${{ vars.SHIFT_START_HOUR || '6' }}
          SHIFT_END_HOUR: ${{ vars.SHIFT_END_HOUR || '18' }}
          # Provider overrides
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL || secrets.SMTP_FROM_EMAIL }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME || secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMS_PROVIDER: ${{ vars.SMS_PROVIDER || 'mock' }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'mock' }}
        run: |
          if [ -n "${DOMAIN_NAME}" ] && [ -z "${ROUTE53_ZONE_ID}" ]; then
            echo "❌ DOMAIN_NAME is set but ROUTE53_ZONE_ID is empty."
            echo "Set ROUTE53_ZONE_ID in GitHub Variables or Secrets to avoid DNS/ACM teardown."
            exit 1
          fi
          chmod +x ./infra/scripts/deploy.sh
          ./infra/scripts/deploy.sh
