name: Unified Release & Docker Pipeline

on:
  push:
    branches:
      - aws-dev-test
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/aws-dev-test' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    name: Determine Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
          branch: ${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}

  docker:
    name: Build & Push Docker Images
    needs: release
    if: (needs.release.outputs.new_release_published == 'true') || (github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/aws-dev-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
        include:
          - service: frontend
            context: ./frontend
            target: prod
          - service: backend
            context: ./iviss-backend
            target: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            ${{ needs.release.outputs.new_release_version != '' && format('type=raw,value={0}', needs.release.outputs.new_release_version) || '' }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-values:
    name: Update Helm Chart Version
    needs: [release, docker]
    if: (needs.release.outputs.new_release_published == 'true') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new release version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          sed -i "s/^  imageTag:.*/  imageTag: \"${RELEASE_VERSION}\"/" charts/backend/values-production.yaml
          sed -i "s/^  imageTag:.*/  imageTag: \"${RELEASE_VERSION}\"/" charts/frontend/values-production.yaml
          git config user.name "iviss-bot"
          git config user.email "bot@iviss.cloud"
          git add charts/backend/values-production.yaml charts/frontend/values-production.yaml
          git commit -m "chore: update Helm chart image tags to ${RELEASE_VERSION}"
          git push
