name: Backend CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "iviss-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "iviss-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        run: docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" -v --redact --config=/path/.gitleaks.toml

  backend_build:
    name: Backend Build
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold pkg-config libssl-dev libleptonica-dev libtesseract-dev tesseract-ocr
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --verbose
        working-directory: iviss-backend

  backend_coverage:
    name: Backend Test and Coverage
    runs-on: arc-runner-set
    needs: [backend_build]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang mold pkg-config libssl-dev libleptonica-dev libtesseract-dev tesseract-ocr
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache cargo-llvm-cov
        id: cache-cargo-llvm-cov
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-v2
      - name: Install cargo-llvm-cov
        if: steps.cache-cargo-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace
        working-directory: iviss-backend
      - name: Test with nextest and coverage instrumentation
        run: cargo llvm-cov --no-report nextest --verbose
        working-directory: iviss-backend
      - name: Doc Test
        run: cargo test --doc --verbose
        working-directory: iviss-backend
      - name: Generate coverage report
        run: cargo llvm-cov report --html --output-dir target/coverage/html --fail-under-lines 55
        working-directory: iviss-backend
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-backend
          path: |
            iviss-backend/target/coverage/html/**/*.html
            iviss-backend/target/coverage/html/**/*.css
            iviss-backend/target/coverage/html/**/*.js
            iviss-backend/target/coverage/html/index.html
          retention-days: 2

  backend_fmt:
    name: Backend Format
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Format
        run: cargo fmt --all -- --check
        working-directory: iviss-backend

  backend_clippy:
    name: Backend Clippy
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang mold pkg-config libssl-dev libleptonica-dev libtesseract-dev tesseract-ocr
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Lint
        run: cargo clippy -- -D warnings
        working-directory: iviss-backend

  backend_audit:
    name: Backend Audit
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang mold pkg-config libssl-dev build-essential libleptonica-dev libtesseract-dev tesseract-ocr
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v1
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit
      - name: Security audit
        # Ignore RUSTSEC-2023-0071 (rsa Marvin Attack) as it is in an unused transitive dependency (sqlx-mysql)
        # and no fixed upgrade is available for this version chain.
        # Ignore RUSTSEC-2025-0111 (tokio-tar) because it is in testcontainers (dev/test tree),
        # and currently no fixed upgrade is available upstream.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0111 --ignore RUSTSEC-2025-0111
        working-directory: iviss-backend

  backend_doc:
    name: Backend Documentation
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang mold pkg-config libssl-dev libleptonica-dev libtesseract-dev tesseract-ocr
      - uses: dtolnay/rust-toolchain@stable
      - name: Build documentation
        run: cargo doc --no-deps --verbose
        working-directory: iviss-backend
