name: Frontend CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [aws-dev-test]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend_install:
    name: Frontend Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

  openapi_codegen:
    name: OpenAPI Codegen
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
      - name: Generate OpenAPI client
        run: npm run codegen
        working-directory: frontend
      - name: Cache api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}

  frontend_build:
    name: Frontend Build
    needs: [frontend_install, openapi_codegen]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Report timing
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $START_TIME ))
          echo "### Build: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  frontend_lint:
    name: Frontend Lint
    needs: [frontend_install, openapi_codegen]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: ESLint
        run: npm run lint:check
        working-directory: frontend
      - name: Report timing
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $START_TIME ))
          echo "### Lint: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  frontend_prettier:
    name: Frontend Prettier
    needs: [frontend_install, openapi_codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Prettier
        run: npm run prettier:check
        working-directory: frontend

  frontend_typescript:
    name: Frontend TypeScript
    needs: [frontend_install, openapi_codegen]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: TypeScript
        run: npm run ts:check
        working-directory: frontend
      - name: Report timing
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $START_TIME ))
          echo "### TypeScript: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  frontend_unit_tests:
    name: Frontend Unit Tests
    needs: [frontend_install, openapi_codegen]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Unit tests
        run: npm run coverage -- --reporter=verbose
        working-directory: frontend
      - name: Cache coverage
        uses: actions/cache/save@v4
        with:
          path: frontend/coverage
          key: frontend-coverage-${{ github.sha }}
      - name: Report timing
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $START_TIME ))
          echo "### Unit Tests: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  frontend_sonarqube:
    name: Frontend SonarQube Analysis
    needs: [frontend_build, frontend_unit_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Restore coverage
        uses: actions/cache/restore@v4
        with:
          path: frontend/coverage
          key: frontend-coverage-${{ github.sha }}
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: |
            -Dsonar.projectKey=IVISS
            -Dsonar.projectBaseDir=frontend
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=false

  report:
    name: Frontend CI Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [frontend_install, openapi_codegen, frontend_build, frontend_lint, frontend_prettier, frontend_typescript, frontend_unit_tests, frontend_sonarqube]
    if: always()
    steps:
      - name: Generate report
        run: |
          echo "## Frontend CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Install | ${{ needs.frontend_install.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OpenAPI Codegen | ${{ needs.openapi_codegen.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.frontend_build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ needs.frontend_lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prettier | ${{ needs.frontend_prettier.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript | ${{ needs.frontend_typescript.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests | ${{ needs.frontend_unit_tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SonarQube | ${{ needs.frontend_sonarqube.result }} |" >> "$GITHUB_STEP_SUMMARY"
