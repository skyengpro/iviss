name: Frontend CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend_install:
    name: Frontend Install
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: frontend
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v1-

  openapi_codegen:
    name: OpenAPI Codegen
    needs: [frontend_install]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
      - name: Generate OpenAPI client
        run: npm run codegen
        working-directory: frontend
      - name: Cache api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}

  frontend_build:
    name: Frontend Build
    needs: [frontend_install, openapi_codegen]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Build
        run: npm run build
        working-directory: frontend

  frontend_lint:
    name: Frontend Lint
    needs: [frontend_install, openapi_codegen]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: ESLint
        run: npm run lint:check
        working-directory: frontend

  frontend_prettier:
    name: Frontend Prettier
    needs: [frontend_install, openapi_codegen]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Prettier
        run: npm run prettier:check
        working-directory: frontend

  frontend_typescript:
    name: Frontend TypeScript
    needs: [frontend_install, openapi_codegen]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: TypeScript
        run: npm run ts:check
        working-directory: frontend

  frontend_unit_tests:
    name: Frontend Unit Tests
    needs: [frontend_install, openapi_codegen]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-v1-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Unit tests
        run: npm run coverage -- --reporter=verbose
        working-directory: frontend
      - name: Cache coverage
        uses: actions/cache/save@v4
        with:
          path: frontend/coverage
          key: frontend-coverage-${{ github.sha }}

  frontend_sonarqube:
    name: Frontend SonarQube Analysis
    needs: [frontend_build, frontend_unit_tests]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore api generated files
        uses: actions/cache@v4
        with:
          path: frontend/src/openapi-rq
          key: ${{ github.sha }}
      - name: Restore coverage
        uses: actions/cache/restore@v4
        with:
          path: frontend/coverage
          key: frontend-coverage-${{ github.sha }}
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: |
            -Dsonar.projectKey=IVISS
            -Dsonar.projectBaseDir=frontend
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true


